<div class="app-shell">
  <aside class="sidebar" aria-label="CodePilot sidebar">
    <div class="sidebar__brand">
      <span class="brand-mark" aria-hidden="true">CP</span>
      <span>CodePilot</span>
    </div>

    <div class="sidebar__search">
      <lib-input placeholder="Search repositories" [disabled]="true">
        <svg
          leading-icon
          class="shell-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <circle cx="11" cy="11" r="6"></circle>
          <path d="m16 16 4 4"></path>
        </svg>
      </lib-input>
    </div>

    <nav class="sidebar__nav" aria-label="Primary navigation">
      <lib-nav-item label="Overview" [active]="true">
        <svg
          nav-icon
          class="shell-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <rect x="3" y="3" width="7" height="7" rx="1"></rect>
          <rect x="14" y="3" width="7" height="7" rx="1"></rect>
          <rect x="3" y="14" width="7" height="7" rx="1"></rect>
          <rect x="14" y="14" width="7" height="7" rx="1"></rect>
        </svg>
      </lib-nav-item>
      <lib-nav-item label="Repositories">
        <svg
          nav-icon
          class="shell-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path
            d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5z"
          ></path>
          <path d="M8 9h8M8 13h8M8 17h5"></path>
        </svg>
      </lib-nav-item>
      <lib-nav-item label="Issues">
        <svg
          nav-icon
          class="shell-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="8"></circle>
          <path d="M12 8v4M12 16h.01"></path>
        </svg>
      </lib-nav-item>
      <lib-nav-item label="Pull Requests">
        <svg
          nav-icon
          class="shell-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <circle cx="6" cy="5" r="2"></circle>
          <circle cx="18" cy="19" r="2"></circle>
          <path d="M6 7v8a4 4 0 0 0 4 4h6M16 5h4v4M20 5l-7 7"></path>
        </svg>
      </lib-nav-item>
      <lib-nav-item label="Commits">
        <svg
          nav-icon
          class="shell-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M3 12h6M15 12h6"></path>
        </svg>
      </lib-nav-item>
      <lib-nav-item label="Branches">
        <svg
          nav-icon
          class="shell-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <circle cx="7" cy="5" r="2"></circle>
          <circle cx="7" cy="19" r="2"></circle>
          <circle cx="17" cy="12" r="2"></circle>
          <path d="M7 7v10M9 5h2a6 6 0 0 1 6 6"></path>
        </svg>
      </lib-nav-item>
      <lib-nav-item label="Validation">
        <svg
          nav-icon
          class="shell-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path d="m5 12 4 4L19 6"></path>
        </svg>
      </lib-nav-item>
      <lib-nav-item label="Settings">
        <svg
          nav-icon
          class="shell-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="3"></circle>
          <path
            d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.14 2.14-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V20h-3v-.09A1.7 1.7 0 0 0 10.66 18.35a1.7 1.7 0 0 0-1.88.34l-.06.06-2.14-2.14.06-.06A1.7 1.7 0 0 0 7 14.67a1.7 1.7 0 0 0-1.56-1.03H5v-3h.09A1.7 1.7 0 0 0 6.65 9.61a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.14-2.14.06.06a1.7 1.7 0 0 0 1.88.34A1.7 1.7 0 0 0 11.36 4.4V4h3v.4a1.7 1.7 0 0 0 1.03 1.53 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.14 2.14-.06.06A1.7 1.7 0 0 0 19.07 9.6a1.7 1.7 0 0 0 1.53 1.03H21v3h-.4A1.7 1.7 0 0 0 19.4 15z"
          ></path>
        </svg>
      </lib-nav-item>
    </nav>

    <div class="sidebar__footer">
      <lib-separator></lib-separator>
      <div class="workspace-profile">
        <lib-avatar initials="CP" size="sm"></lib-avatar>
        <div>
          <strong>CodePilot workspace</strong>
          <span>Static foundation</span>
        </div>
      </div>
    </div>
  </aside>

  <section class="workspace">
    <header class="topbar">
      <span class="repository-context">
        <svg
          class="shell-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path d="m9 18 6-6-6-6"></path>
        </svg>
        repository / context pending
      </span>
      <lib-status-dot
        status="muted"
        label="System checks pending"
      ></lib-status-dot>
    </header>

    <main class="foundation" aria-labelledby="foundation-heading">
      <lib-card class="foundation-card">
        <lib-card-section>
          <lib-badge variant="violet">Foundation</lib-badge>
          <h1 id="foundation-heading">{{ title }}</h1>
          <p>
            Your repository workspace will appear here once a future CodePilot
            feature connects it.
          </p>
        </lib-card-section>
      </lib-card>
    </main>
  </section>
</div>

<!-- Keep the Issue #4 web-to-data graph edge without exposing the generated data stub. -->
@if (preserveDataDependency) {
<lib-data></lib-data>
}
